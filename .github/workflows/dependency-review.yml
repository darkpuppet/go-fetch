# Review new or updated dependencies on pull requests.
# Blocks the PR when a changed package has a high or critical advisory.
# Requires Dependency graph: Settings → Code security → Dependency graph.

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check dependency graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >/tmp/dep-graph.json 2>/tmp/dep-graph.err
          status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          cat /tmp/dep-graph.err
          echo "::warning::Dependency graph is not enabled. Enable it at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/security_analysis so this job can block high-severity dependency changes."

      - name: Dependency review
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
